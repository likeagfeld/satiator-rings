name: Build PowerRings

on:
  push:
    branches: [ "claude/cloud-build-sega-reskin-01VCNYdx6SxJnF16oFAMw6dk" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build PowerRings in Docker
      run: |
        docker build -t powerrings-builder .
        docker run -v ${{ github.workspace }}:/home/user/satiator-rings powerrings-builder /usr/local/bin/build.sh

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: powerrings-binaries
        path: |
          *.bin
          *.iso
          *.cue
          SD/
